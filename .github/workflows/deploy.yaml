name: deploy-chabokan

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install Chabokan CLI
        run: npm install -g @chabokan.net/cli
      
      - name: Deploy to Chabokan
        env:
          CHABOKAN_USERNAME: ${{ secrets.CHABOKAN_USERNAME }}
          CHABOKAN_PASSWORD: ${{ secrets.CHABOKAN_PASSWORD }}
        run: |
          echo "Deploying to Chabokan..."
          chabok deploy -s parvareshyar --username "$CHABOKAN_USERNAME" --password "$CHABOKAN_PASSWORD" || \
          chabok deploy -s parvareshyar -u "$CHABOKAN_USERNAME" -p "$CHABOKAN_PASSWORD"
